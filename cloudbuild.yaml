# Bygger containern och deployar till Cloud Run (Cloud Run europe-north1 – Firebase Hosting stöder ännu inte europe-north2).
# Kör: gcloud builds submit --config cloudbuild.yaml --project insikt-riksdag
substitutions:
  _REGION: europe-north1
  _SERVICE: insikt
  _TAG: manual
  _IMAGE: europe-north2-docker.pkg.dev/${PROJECT_ID}/insikt/app
  _SUPABASE_URL: https://c--9d4e6ad4-0a13-46f7-b350-838d2340f485-prod.lovable.cloud
  _SUPABASE_PROJECT_ID: olwkuzvyiidxgqpnefrh

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/SUPABASE_PUBLISHABLE_KEY/versions/latest
      env: SUPABASE_PUBLISHABLE_KEY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [SUPABASE_PUBLISHABLE_KEY]
    args:
      - -c
      - |
        docker build \
          --build-arg VITE_SUPABASE_URL=${_SUPABASE_URL} \
          --build-arg VITE_SUPABASE_PROJECT_ID=${_SUPABASE_PROJECT_ID} \
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$$SUPABASE_PUBLISHABLE_KEY" \
          -t ${_IMAGE}:${_TAG} -t ${_IMAGE}:latest .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-invoker-iam-check
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=SUPABASE_URL=${_SUPABASE_URL},SUPABASE_PROJECT_ID=${_SUPABASE_PROJECT_ID},NODE_ENV=production
      - --set-secrets=SUPABASE_PUBLISHABLE_KEY=SUPABASE_PUBLISHABLE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,INGEST_SECRET=CRON_SECRET:latest

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
