# Bygger containern och deployar till Cloud Run (Cloud Run europe-north1 – Firebase Hosting stöder ännu inte europe-north2).
# Kör: gcloud builds submit --config cloudbuild.yaml --project insikt-riksdag
substitutions:
  _REGION: europe-north1
  _SERVICE: insikt
  _TAG: manual
  _IMAGE: europe-north2-docker.pkg.dev/${PROJECT_ID}/insikt/app
  # Firebase-klientkonfiguration är publik och bäddas in i klientbundeln vid bygg.
  _VITE_FIREBASE_API_KEY: AIzaSyBoIVPlVSfKyZd-F61qtSQgLytMmdiYgqs
  _VITE_FIREBASE_AUTH_DOMAIN: insikt-riksdag.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: insikt-riksdag
  _VITE_FIREBASE_APP_ID: 1:741137979566:web:11f2a181bf5ad18c73753f

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-invoker-iam-check
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID},NODE_ENV=production
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,INGEST_SECRET=CRON_SECRET:latest

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
